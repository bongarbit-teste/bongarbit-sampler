; PlatformIO Project Configuration File
;
; Hardware: ESP32-S3 N16R8 (16MB Quad flash + 8MB Octal PSRAM)
;         + PCM5102A I2S DAC breakout
;         + microSD card reader (SPI)
;
; See docs/circuit.md for the full wiring plan and pin justification.
;
; Two environments share src/, split by build_src_filter so only one sketch
; (one setup()/loop() pair) is compiled per build:
;   - esp32-s3-devkitc-1 (default): the sampler firmware, main.cpp
;   - sd_test: standalone SD card diagnostic, test_sd.cpp (uses the Arduino
;     core's own SD.h, not SdFat/M16 - useful to rule out a library-specific
;     issue when debugging SD hardware in isolation)
;
; Build/upload a specific one with: pio run -e sd_test -t upload

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 memory configuration ---
; The generic "esp32-s3-devkitc-1" board definition in PlatformIO defaults to
; a plain 8MB/no-PSRAM layout. N16R8 = 16MB Quad-SPI flash + 8MB Octal-SPI
; PSRAM, so it must be overridden explicitly.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    ; This board exposes only the native USB port (no separate CP2102/CH340
    ; UART bridge chip) - without this flag, Serial defaults to UART0 (GPIO
    ; 43/44), which isn't wired to anything, and the serial monitor stays
    ; empty even though the firmware is running fine.
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32-s3-devkitc-1]
; Bounce2 lock-out mode: the first edge is reported immediately, then further
; changes are ignored for the interval. Must be a build flag (not a #define in
; main.cpp) because the switch is read inside Bounce2.cpp, compiled separately.
build_flags =
    ${env.build_flags}
    -DBOUNCE_LOCK_OUT
build_src_filter =
    +<*>
    -<test_sd.cpp>
    -<test_piezo.cpp>
    -<test_sensor.cpp>
lib_deps =
    https://github.com/algomusic/M16.git
    greiman/SdFat @ ^2.3.0
    thomasfredericks/Bounce2 @ ^2.71

; Same firmware as the default env (src/main.cpp), under its own name.
[env:botoes-falantes]
extends = env:esp32-s3-devkitc-1

[env:sd_test]
build_src_filter =
    +<test_sd.cpp>
    -<main.cpp>

; Piezo diagnostic: pressing button i records every ADC reading of piezo i for
; PIEZO_WINDOW_MS and dumps it as CSV over Serial (plot it with
; tools/plot_piezo.py). No audio/SD, so no M16/SdFat needed.
[env:piezo_test]
build_flags =
    ${env.build_flags}
    -DBOUNCE_LOCK_OUT
build_src_filter =
    +<test_piezo.cpp>
    -<main.cpp>
lib_deps =
    thomasfredericks/Bounce2 @ ^2.71

; IR reflective distance sensor diagnostic: prints the analog reading of the
; sensor on GPIO8 (raw, averaged, millivolts, min/max) over Serial.
[env:sensor_test]
build_src_filter =
    +<test_sensor.cpp>
    -<main.cpp>
